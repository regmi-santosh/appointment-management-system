## Subagent template
# Subagents are lightweight agents invoked by parent agents to perform focused tasks.

id: example-subagent
name: Example Subagent
description: "Focused worker for code formatting and linting."
entrypoint: toolkit.runtime:run_subagent
capabilities:
  - lint
  - format
  - quick-fix
parent_agent: example-agent
config:
  timeout_seconds: 30
  sandboxed: true
