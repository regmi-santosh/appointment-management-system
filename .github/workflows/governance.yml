name: Governance Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pre-commit flake8 mypy bandit pip-audit safety
      - name: Run governance coordinator
        run: |
          python toolkit/runners/run_agents.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: toolkit/reports/agents-report.md
