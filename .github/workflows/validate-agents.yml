name: Validate Agents

on:
  push:
    paths:
      - '.github/agents/**'
      - 'toolkit/skills/**'
  pull_request:
    paths:
      - '.github/agents/**'
      - 'toolkit/skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install yamllint and pyyaml
        run: |
          python -m pip install --upgrade pip
          pip install yamllint pyyaml

      - name: Run yamllint
        run: |
          yamllint .github/agents || true
          yamllint toolkit/skills || true

      - name: Parse agent YAML files
        run: |
          python - <<'PY'
import glob,sys,yaml
files = glob.glob('.github/agents/**/*.*y*', recursive=True) + glob.glob('toolkit/skills/**/*.*y*', recursive=True)
errors = 0
for f in files:
    try:
        with open(f,'r') as fh:
            yaml.safe_load(fh)
    except Exception as e:
        print(f'YAML parse error in {f}:', e)
        errors += 1
if errors:
    print('\nYAML parse failures detected')
    sys.exit(1)
print('All agent YAML files parsed successfully')
PY
